name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          pip install -e '.[test]'
      - name: Run tests
        run: |
          python -m pytest
  test-llm-floor:
    # The declared minimums together: oldest Python with oldest llm.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies with the minimum supported llm
        run: |
          pip install -e '.[test]' 'llm==0.31'
      - name: Run tests
        run: |
          python -m pytest
  test-llm-prerelease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies with llm pre-release
        run: |
          pip install -e '.[test]'
          pip install --pre --upgrade llm
      - name: Run tests
        run: |
          python -m pytest
