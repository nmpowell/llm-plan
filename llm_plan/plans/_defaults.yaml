# Shared definitions for the bundled plans.
#
# Plans extend this file (`extends: "_defaults.yaml"`) and reference values
# as ${models.claude_high}, ${prompts.synthesise}, etc.
#
# The models are named by capability tier — <provider>_low, _medium and
# _high — rather than by version, so moving a plan to a newer model is a
# one-line edit here. Gemini deliberately has no medium tier, so plans use
# gemini_low wherever they want a cheaper Gemini.
#
# Model values are passed straight to llm's model resolution, so they may be
# model IDs, plugin aliases, or aliases you set with `llm aliases set`.
# The defaults below need reasonably recent llm-anthropic and llm-gemini
# plugins installed, plus llm's own OpenAI support; override any of them by
# copying this file and the plan into your own plans directory
# (`llm plan path`).

models:
  # Anthropic
  claude_low: "anthropic/claude-sonnet-5"
  claude_medium: "anthropic/claude-opus-5"
  claude_high: "anthropic/claude-fable-5-1"

  # Google — no medium tier; plans use gemini_low where they want a cheaper one
  gemini_low: "gemini/gemini-3.8-flash"
  gemini_high: "gemini/gemini-3.1-pro-preview"

  # OpenAI
  openai_low: "gpt-5.6-luna"
  openai_medium: "gpt-5.6-sol"
  openai_high: "gpt-6-astra"

prompts:
  synthesise: "prompts/synthesise.md"
  expand_research: "prompts/expand_research.md"
