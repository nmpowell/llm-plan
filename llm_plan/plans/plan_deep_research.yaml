# Deep Research: expand a raw question into a comprehensive research brief,
# then run Google's Gemini Deep Research agent on it.
#
#   llm plan deep_research "Your research question or idea" -f context.md
#
# The research stage calls the Gemini Interactions API directly (stdlib-only
# script, no extra dependencies) and needs a Gemini API key: $GEMINI_API_KEY,
# $LLM_GEMINI_KEY, or the key stored by `llm keys set gemini`. A research
# task takes minutes to an hour and costs real money (roughly $1-3 on the
# standard tier, $3-7 on max) — preview with --explain first. The expanded
# brief is also usable on its own: paste it into other research agents while
# Gemini runs.
#
# To use the max tier or a different wait, copy this plan into your own
# plans directory (`llm plan path`) and edit `settings:` below.
extends: "_defaults.yaml"

name: "deep_research"
summary: "Expand a research question, then run Gemini Deep Research"

settings:
  # deep-research-preview-04-2026 (standard, ~80 searches) or
  # deep-research-max-preview-04-2026 (max, ~160 searches, 2-3x the cost).
  research_agent: "deep-research-preview-04-2026"
  # The API's research-duration maximum is 60 minutes.
  research_max_wait_minutes: "60"

stages:
  - name: "expand_prompt"
    summary: "Expand the raw question into a full Deep Research brief"
    model: "${models.gemini_high}"
    prompt:
      - prompt: "${prompts.expand_research}"
        label: "Deep Research Prompt Architect Instructions"
      - prompt: "CLI"
        label: "Research Topic"
    produces: "Expanded Deep Research Prompt"

  - name: "research"
    type: "python_script"
    summary: "Run Gemini Deep Research on the expanded brief"
    script: "scripts/deep_research.py"
    script_args:
      - "--agent"
      - "${settings.research_agent}"
      - "--max-wait"
      - "${settings.research_max_wait_minutes}"
    # Outlasts the script's own --max-wait deadline so a slow run ends with
    # the script's clean timeout error, not a process-group kill.
    timeout: 4500
    depends_on: [expand_prompt]
    produces: "Gemini Deep Research Report"
